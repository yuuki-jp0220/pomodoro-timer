<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17243a"><title>ポモドーロ＆作業用タイマー</title><style>
:root{font-family:system-ui,"Noto Sans JP",sans-serif;color:#f2f6fc;background:#101a2b}*{box-sizing:border-box}body{margin:0}header{max-width:850px;margin:auto;padding:22px 16px}small,.accent{color:#65d6b0}main{max-width:850px;margin:auto;padding:0 14px 35px}nav,.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:center}button{border:1px solid #30435e;background:#22334d;color:#f2f6fc;border-radius:11px;padding:11px 14px;font:inherit;cursor:pointer}button.primary{background:#65d6b0;color:#10251f;border-color:#65d6b0}button.on{border-color:#65d6b0;color:#65d6b0}.card{background:#19273d;border:1px solid #30435e;border-radius:18px;padding:18px;margin:13px 0}.center{text-align:center}.muted{color:#a8b7cc;font-size:13px}.time{font-size:clamp(65px,17vw,115px);font-weight:750;letter-spacing:-.06em;font-variant-numeric:tabular-nums;margin:14px 0}input{background:#101c2e;color:white;border:1px solid #30435e;border-radius:9px;padding:10px;font:inherit;width:90px}label{display:inline-block;color:#a8b7cc;font-size:13px;margin:8px}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#22334d;border-radius:12px;padding:12px}.stat b{display:block;font-size:23px}.bar{height:7px;background:#30435e;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:#65d6b0;width:0}.item{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #30435e}</style>
<header><small>FOCUS / TIME MANAGEMENT</small><h1>ポモドーロ＆作業用タイマー</h1><div class=muted>集中と休憩をシンプルに管理。</div></header><main><nav><button class="tab on" data-tab="pomo">ポモドーロ</button><button class=tab data-tab="count">カウントダウン</button><button class=tab data-tab="watch">ストップウォッチ</button><button class=tab data-tab="settings">記録・設定</button></nav>
<section id=pomo><div class="card center"><div class=row><button class=mode on data-mode=work>集中</button><button class=mode data-mode=short>短い休憩</button><button class=mode data-mode=long>長い休憩</button></div><div class=accent id=modeLabel>FOCUS SESSION</div><div class=time id=pomoTime>25:00</div><div class=bar><span id=progress></span></div><p class=muted id=round>セッション 1</p><div class=row><button class=primary id=start>スタート</button><button id=reset>リセット</button><button id=skip>スキップ</button></div></div><div class="card stats"><div class=stat><span class=muted>完了</span><b id=sessions>0</b></div><div class=stat><span class=muted>集中時間</span><b id=focus>0分</b></div><div class=stat><span class=muted>連続</span><b id=streak>0</b></div></div></section>
<section id=count class=hidden><div class="card center"><div class=accent>COUNTDOWN</div><div class=time id=countTime>10:00</div><div class=row><button class=primary id=countStart>スタート</button><button id=countPause>一時停止</button><button id=countReset>リセット</button></div><div class=row><label>分<br><input id=countM type=number min=0 max=999 value=10></label><label>秒<br><input id=countS type=number min=0 max=59 value=0></label><button id=countSet>時間設定</button></div></div></section>
<section id=watch class=hidden><div class="card center"><div class=accent>STOPWATCH</div><div class=time id=watchTime>00:00.00</div><div class=row><button class=primary id=watchStart>スタート</button><button id=lap>ラップ</button><button id=watchReset>リセット</button></div><div id=laps></div></div></section>
<section id=settings class=hidden><div class=card><h3>時間設定（分）</h3><label>集中<br><input id=work type=number min=1 max=180 value=25></label><label>短い休憩<br><input id=short type=number min=1 max=60 value=5></label><label>長い休憩<br><input id=long type=number min=1 max=120 value=15></label><label>長い休憩までの回数<br><input id=every type=number min=2 max=10 value=4></label><p><label><input id=auto type=checkbox> 終了後に自動開始</label><label><input id=sound type=checkbox checked> 終了音</label></p><button class=primary id=save>設定を保存</button></div><div class=card><div class=row style="justify-content:space-between"><h3>今日の記録</h3><button id=clear>記録を消去</button></div><div id=records class=muted>記録はありません</div></div></section><p class="muted center">スリープやブラウザ終了中は、表示・音が止まる場合があります。重要な予定には端末のアラームも併用してください。</p></main>
<script>
const $=x=>document.getElementById(x),key="pomoSettings",old=JSON.parse(localStorage[key]||"{}");let cfg={work:25,short:5,long:15,every:4,auto:false,sound:true,...old.cfg},mode="work",left=cfg.work*60,total=left,run=false,end=0,timer=null,done=old.done||0,focus=old.focus||0,streak=0,records=old.records||[];
function saveDB(){localStorage[key]=JSON.stringify({cfg,done,focus,records})}function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function draw(){let names={work:"集中",short:"短い休憩",long:"長い休憩"};$("modeLabel").textContent=names[mode];$("pomoTime").textContent=fmt(left);$("progress").style.width=(100*(total-left)/total)+"%";$("round").textContent="完了 "+done+" 回 ・ 次の長い休憩まで "+(cfg.every-done%cfg.every);$("start").textContent=run?"一時停止":"スタート";$("sessions").textContent=done;$("focus").textContent=focus+"分";$("streak").textContent=streak;document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("on",b.dataset.mode===mode))}
function stop(){run=false;clearInterval(timer);timer=null;draw()}function beep(){if(!cfg.sound)return;try{let c=new AudioContext();[0,.2,.4].forEach(t=>{let o=c.createOscillator(),g=c.createGain();o.frequency.value=760;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.001,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.2,c.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.16);o.start(c.currentTime+t);o.stop(c.currentTime+t+.17)})}catch{}}
function setMode(m){stop();mode=m;left=total=cfg[m]*60;draw()}function start(){if(run){stop();return}if(left<=0)left=total;run=true;end=Date.now()+left*1000;timer=setInterval(()=>{left=Math.max(0,(end-Date.now())/1000);draw();if(!left)finish()},150);draw()}
function finish(){stop();beep();if(mode==="work"){done++;focus+=cfg.work;streak++;records.unshift({t:new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}),v:"集中 "+cfg.work+"分"});saveDB();render();let next=done%cfg.every===0?"long":"short";setMode(next)}else setMode("work");if(cfg.auto)start()}
$("start").onclick=start;$("reset").onclick=()=>{stop();left=total=cfg[mode]*60;draw()};$("skip").onclick=()=>setMode(mode==="work"?(done+1)%cfg.every===0?"long":"short":"work");document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
let cLeft=600,cTotal=600,cEnd=0,cTimer=null;function cDraw(){$("countTime").textContent=fmt(cLeft)}function cStop(){clearInterval(cTimer);cTimer=null}
$("countStart").onclick=()=>{if(cTimer){cStop();return}if(cLeft<=0)return;cEnd=Date.now()+cLeft*1000;cTimer=setInterval(()=>{cLeft=Math.max(0,(cEnd-Date.now())/1000);cDraw();if(!cLeft){cStop();beep()}},100)};$("countPause").onclick=()=>{if(cTimer){cLeft=Math.max(0,(cEnd-Date.now())/1000);cStop();cDraw()}};$("countReset").onclick=()=>{cStop();cLeft=cTotal;cDraw()};$("countSet").onclick=()=>{cStop();cLeft=cTotal=Math.max(0,Math.min(999,+$("countM").value||0))*60+Math.max(0,Math.min(59,+$("countS").value||0));cDraw()};
let wRun=false,wAt=0,wElapsed=0,wTimer=null,lapList=[];function wDraw(){let n=wElapsed+(wRun?Date.now()-wAt:0),cs=Math.floor(n/10)%100,s=Math.floor(n/1000)%60,m=Math.floor(n/60000);$("watchTime").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+String(cs).padStart(2,"0")}
$("watchStart").onclick=()=>{if(wRun){wElapsed+=Date.now()-wAt;wRun=false;clearInterval(wTimer);$("watchStart").textContent="再開"}else{wAt=Date.now();wRun=true;wTimer=setInterval(wDraw,30);$("watchStart").textContent="一時停止"}wDraw()};$("lap").onclick=()=>{if(!wRun&&!wElapsed)return;lapList.unshift($("watchTime").textContent);$("laps").innerHTML=lapList.map((x,i)=>'<div class=item>ラップ '+(lapList.length-i)+'<b>'+x+"</b></div>").join("")};$("watchReset").onclick=()=>{wRun=false;clearInterval(wTimer);wElapsed=0;lapList=[];$("laps").innerHTML="";$("watchStart").textContent="スタート";wDraw()};
function render(){ $("records").innerHTML=records.length?records.map(r=>'<div class=item>'+r.t+"　"+r.v+"<b>完了</b></div>").join(""):"記録はありません"}function load(){["work","short","long","every"].forEach(k=>$(k).value=cfg[k]);$("auto").checked=cfg.auto;$("sound").checked=cfg.sound}
$("save").onclick=()=>{let w=+$("work").value,s=+$("short").value,l=+$("long").value,e=+$("every").value;if(!w||!s||!l||e<2||e>10)return alert("時間・回数を確認してください");cfg={work:w,short:s,long:l,every:e,auto:$("auto").checked,sound:$("sound").checked};stop();left=total=cfg[mode]*60;saveDB();draw();alert("保存しました")};$("clear").onclick=()=>{if(confirm("記録を消去しますか？")){records=[];done=focus=0;saveDB();render();draw()}};document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));["pomo","count","watch","settings"].forEach(x=>$(x).classList.toggle("hidden",x!==b.dataset.tab))});load();render();draw();cDraw();wDraw();document.addEventListener("visibilitychange",()=>{if(run){left=Math.max(0,(end-Date.now())/1000);draw()}});
</script></html>
